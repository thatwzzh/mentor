[project]
name = "mentor"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.13.11"
dependencies = [
    "aiobotocore>=3.9.2",
    "deepagents>=0.7.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.6.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.4.1",
    "langchain-quickjs>=0.3.5",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "langgraph-api>=0.16.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-sdk>=0.4.2",
    "opensandbox>=1.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "tavily-python>=0.7.26",
    "types-aiobotocore[s3]>=3.9.2",
]

[dependency-groups]
dev = [
    "jupyter==1.1.1",
    "pyright==1.1.411",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "questionary==2.0.0",
    "rich>=14",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
